name: aqar

services:
  postgres:
    image: postgres:18.7-alpine
    container_name: aqar-postgres
    environment:
      POSTGRES_DB: aqar
      POSTGRES_USER: aqar
      POSTGRES_PASSWORD: aqar
    ports:
      - "55432:5432"
    volumes:
      - aqar-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqar -d aqar"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  aqar-pgdata:
