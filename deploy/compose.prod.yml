name: aqar

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqar
      POSTGRES_USER: aqar
      POSTGRES_PASSWORD: ${AQAR_DB_PASSWORD:?set AQAR_DB_PASSWORD in deploy/.env.prod}
    volumes:
      - aqar-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqar -d aqar"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      AQAR_DB_URL: jdbc:postgresql://postgres:5432/aqar
      AQAR_API_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started

volumes:
  aqar-pgdata:
  caddy-data:
  caddy-config:
